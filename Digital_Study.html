<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worksheet Practice with Scrollable Answers</title>
<style>
body {
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  padding:15px;
  margin:0;
}
h1 {
  text-align:center;
  color:#333;
  font-size:1.8em;
}
#worksheet img {
  max-width: 100%;
  max-height: 300px; /* fixed height for image */
  margin: 10px 0;
  border-radius: 8px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  transition: transform 0.3s;
  display:block;
  object-fit: contain; /* keep aspect ratio */
}
.answer-box {
  width: 100%;
  height: 120px; /* fixed height for scrollable area */
  padding: 8px;
  margin: 5px 0 15px 0;
  border-radius: 4px;
  border: 1px solid #ccc;
  resize: vertical;
  font-size: 1em;
  overflow-y: auto;
}
button {
  background:#4CAF50;
  color:white;
  padding:10px 16px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  font-size:1em;
  margin-top:5px;
}
button:hover { background:#45a049; }
.rotate-btn {
  background:#2196F3;
  margin-left:5px;
  font-size:0.9em;
}
#thankyou {
  text-align:center;
  font-size:1.2em;
  color:#333;
  margin-top:20px;
  display:none;
}
.question-container {
  margin-bottom:25px;
}
@media (max-width:600px) {
  .answer-box { height:100px; font-size:1em; }
  button, .rotate-btn { width:48%; margin-top:10px; }
}
</style>
</head>
<body>

<h1>Student Worksheet</h1>

<input type="file" id="fileInput" accept="image/*" multiple>
<button onclick="loadImages()">Load Worksheet</button>

<div id="worksheet"></div>

<button onclick="submitAnswers()">Submit</button>
<div id="thankyou">Thank you! Your answers are saved.</div>

<script>
let images = [];
let rotations = [];

function loadImages() {
  const files = document.getElementById("fileInput").files;
  if (!files.length) { alert("Please select at least one image"); return; }

  const worksheetDiv = document.getElementById("worksheet");
  worksheetDiv.innerHTML = "";
  images = [];
  rotations = [];

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const reader = new FileReader();

    reader.onload = function(e) {
      const imgURL = e.target.result;
      images.push(imgURL);
      rotations.push(0);

      const container = document.createElement("div");
      container.className = "question-container";

      const img = document.createElement("img");
      img.src = imgURL;
      img.id = "img" + i;

      const textarea = document.createElement("textarea");
      textarea.className = "answer-box";
      textarea.id = "answer" + i;
      textarea.placeholder = "Write your answer here...";

      const rotateLeftBtn = document.createElement("button");
      rotateLeftBtn.className = "rotate-btn";
      rotateLeftBtn.innerText = "⟲ Rotate Left";
      rotateLeftBtn.onclick = () => rotateImage(i, -90);

      const rotateRightBtn = document.createElement("button");
      rotateRightBtn.className = "rotate-btn";
      rotateRightBtn.innerText = "⟳ Rotate Right";
      rotateRightBtn.onclick = () => rotateImage(i, 90);

      container.appendChild(img);
      container.appendChild(textarea);
      container.appendChild(rotateLeftBtn);
      container.appendChild(rotateRightBtn);

      worksheetDiv.appendChild(container);
    };

    reader.readAsDataURL(file);
  }
}

function rotateImage(index, degree) {
  rotations[index] += degree;
  const img = document.getElementById("img" + index);
  img.style.transform = `rotate(${rotations[index]}deg)`;
}

function submitAnswers() {
  const answers = images.map((img, i) => {
    return { image: img, answer: document.getElementById("answer"+i).value, rotation: rotations[i] };
  });

  localStorage.setItem("studentAnswers", JSON.stringify(answers));
  document.getElementById("thankyou").style.display = "block";
}
</script>

</body>
</html>
