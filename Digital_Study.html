<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worksheet with Pinch, Drag, Rotate & Reset</title>
<style>
body {
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  padding:15px;
  margin:0;
}
h1 {
  text-align:center;
  color:#333;
  font-size:1.8em;
  margin-bottom:20px;
}
.question-container {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  background:#fff;
  padding:15px;
  margin-bottom:20px;
  border-radius:8px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  flex-wrap: wrap;
}
.answer-box {
  width:48%;
  min-height:200px;
  padding:8px;
  border-radius:4px;
  border:1px solid #ccc;
  resize: vertical;
  font-size:1em;
  overflow-y: auto;
}
.image-container {
  width:48%;
  text-align:center;
  overflow:hidden;
  position:relative;
}
.image-container img {
  max-width:100%;
  max-height:400px;
  border-radius:8px;
  transition: transform 0.1s;
  object-fit: contain;
  touch-action: none; /* needed for pinch & drag */
  cursor: grab;
  position: relative;
}
.button-group {
  margin-top:10px;
  display:flex;
  justify-content:flex-start;
  flex-wrap: wrap;
  gap:10px;
}
button {
  background:#4CAF50;
  color:white;
  padding:10px 16px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  font-size:1em;
}
button:hover { background:#45a049; }
.rotate-btn { background:#2196F3; }
#thankyou {
  text-align:center;
  font-size:1.2em;
  color:#333;
  margin-top:20px;
  display:none;
}
@media (max-width:600px) {
  .answer-box, .image-container { width:100%; }
  .image-container img { max-height:300px; }
}
</style>
</head>
<body>

<h1>Student Worksheet</h1>

<input type="file" id="fileInput" accept="image/*" multiple>
<button onclick="loadImages()">Load Worksheet</button>

<div id="worksheet"></div>

<button onclick="submitAnswers()">Submit</button>
<div id="thankyou">Thank you! Your answers are saved.</div>

<script>
let images = [];
let rotations = [];
let scales = [];
let startDistance = 0;
let currentImgIndex = null;
let lastTouchEnd = 0;
let startX = 0;
let startY = 0;
let translateX = [];
let translateY = [];
let isDragging = false;

function loadImages() {
  const files = document.getElementById("fileInput").files;
  if (!files.length) { alert("Please select at least one image"); return; }

  const worksheetDiv = document.getElementById("worksheet");
  worksheetDiv.innerHTML = "";
  images = [];
  rotations = [];
  scales = [];
  translateX = [];
  translateY = [];

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const reader = new FileReader();

    reader.onload = function(e) {
      const imgURL = e.target.result;
      images.push(imgURL);
      rotations.push(0);
      scales.push(1);
      translateX.push(0);
      translateY.push(0);

      const container = document.createElement("div");
      container.className = "question-container";

      // Answer box
      const textarea = document.createElement("textarea");
      textarea.className = "answer-box";
      textarea.id = "answer" + i;
      textarea.placeholder = "Write your answer here...";

      // Image container
      const imgContainer = document.createElement("div");
      imgContainer.className = "image-container";

      const img = document.createElement("img");
      img.src = imgURL;
      img.id = "img" + i;

      // Rotate buttons
      const rotateLeftBtn = document.createElement("button");
      rotateLeftBtn.className = "rotate-btn";
      rotateLeftBtn.innerText = "⟲ Rotate Left";
      rotateLeftBtn.onclick = () => rotateImage(i, -90);

      const rotateRightBtn = document.createElement("button");
      rotateRightBtn.className = "rotate-btn";
      rotateRightBtn.innerText = "⟳ Rotate Right";
      rotateRightBtn.onclick = () => rotateImage(i, 90);

      const btnGroup = document.createElement("div");
      btnGroup.className = "button-group";
      btnGroup.appendChild(rotateLeftBtn);
      btnGroup.appendChild(rotateRightBtn);

      imgContainer.appendChild(img);
      imgContainer.appendChild(btnGroup);
      container.appendChild(textarea);
      container.appendChild(imgContainer);
      worksheetDiv.appendChild(container);

      // Pinch zoom & drag
      img.addEventListener('touchstart', (e) => handleTouchStart(e, i));
      img.addEventListener('touchmove', (e) => handleTouchMove(e, i));
      img.addEventListener('touchend', (e) => handleTouchEnd(e, i));
    };

    reader.readAsDataURL(file);
  }
}

function rotateImage(index, degree) {
  rotations[index] += degree;
  updateTransform(index);
}

function updateTransform(index) {
  const img = document.getElementById("img" + index);
  img.style.transform = `translate(${translateX[index]}px, ${translateY[index]}px) rotate(${rotations[index]}deg) scale(${scales[index]})`;
}

function handleTouchStart(e, index) {
  if (e.touches.length === 2) {
    currentImgIndex = index;
    startDistance = getDistance(e.touches[0], e.touches[1]);
    e.preventDefault();
  } else if (e.touches.length === 1) {
    currentImgIndex = index;
    isDragging = true;
    startX = e.touches[0].clientX - translateX[index];
    startY = e.touches[0].clientY - translateY[index];
  }
}

function handleTouchMove(e, index) {
  if (e.touches.length === 2 && currentImgIndex === index) {
    const newDistance = getDistance(e.touches[0], e.touches[1]);
    const delta = (newDistance - startDistance) / 200;
    scales[index] += delta;
    if (scales[index] < 0.1) scales[index] = 0.1;
    startDistance = newDistance;
    updateTransform(index);
    e.preventDefault();
  } else if (isDragging && e.touches.length === 1 && currentImgIndex === index) {
    translateX[index] = e.touches[0].clientX - startX;
    translateY[index] = e.touches[0].clientY - startY;
    updateTransform(index);
  }
}

function handleTouchEnd(e, index) {
  isDragging = false;

  // Detect double-tap for reset
  const now = new Date().getTime();
  if (now - lastTouchEnd <= 300) {
    rotations[index] = 0;
    scales[index] = 1;
    translateX[index] = 0;
    translateY[index] = 0;
    updateTransform(index);
  }
  lastTouchEnd = now;
}

function getDistance(touch1, touch2) {
  const dx = touch2.clientX - touch1.clientX;
  const dy = touch2.clientY - touch1.clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

function submitAnswers() {
  const answers = images.map((img, i) => {
    return {
      image: img,
      answer: document.getElementById("answer"+i).value,
      rotation: rotations[i],
      scale: scales[i],
      translateX: translateX[i],
      translateY: translateY[i]
    };
  });
  localStorage.setItem("studentAnswers", JSON.stringify(answers));
  document.getElementById("thankyou").style.display = "block";
}
</script>

</body>
</html>
