<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin: auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.6rem;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #a5665d;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

            button:hover {
                background: #a5665d;
            }

        .table-wrapper {
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background: #a5665d;
            color: white;
        }

        @media (max-width: 480px) {
            h2 {
                font-size: 1.3rem;
            }

            input, select, button {
                font-size: 0.95rem;
                padding: 10px;
            }

            table {
                font-size: 0.85rem;
            }
        }

       
        

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .total-record {
            font-size: 14px;
            color: #555;
            margin: 0;
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .pagination button {
                padding: 5px 10px;
                font-size: 13px;
                border: 1px solid #ccc;
                background: #e0e0e0; /* grey for inactive */
                color: #333;
                cursor: pointer;
                border-radius: 4px;
                transition: all 0.2s;
            }

                .pagination button:hover {
                    background: #d5d5d5; /* slightly darker grey on hover */
                }

                .pagination button.active {
                    background: #a0522d !important; /* brown */
                    color: white !important;
                    border-color: #a0522d !important;
                    font-weight: bold;
                }






        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5); /* semi-transparent */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* above everything */
        }

        /* Spinner container */
        .spinner-container {
            text-align: center;
            color: #fff;
        }

        /* Spinner animation */
        .spinner {
            border: 8px solid rgba(213 59 59 / 30%); /* Light border */
            border-top: 8px solid #fff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            margin: 0 auto 15px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 1.2em;
            font-weight: bold;
        }

        .chart-panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            margin: 20px auto;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .panel-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        canvas {
            width: 50% !important;
            height: 200px !important;
        }


        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .panel-header h2 {
                margin: 0;
                font-size: 20px;
            }

        .btn-link {
            padding: 8px 14px;
            background: #a5665d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

            .btn-link:hover {
                background: #a5665d;
            }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>
    <div class="container">
        <div id="overlay">
            <div class="spinner-container" id="loading">
                <div class="spinner"></div>
                <div class="loading-text">Please wait dashbaord loading...</div>
            </div>
        </div>

        <div class="chart-panel">
            <div class="panel-header">
                <h2>All Appointments</h2>
                <a href="Barber_Book.html" class="btn-link">Book</a>
            </div>

            <table id="tableContainer" class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Service</th>
                        <th>Time</th>
                        <th>Chat</th>

                    </tr>
                </thead>
                <tbody id="tableBody" class="table">
                </tbody>

            </table>

            <!--<a href="https://wa.me/91?text=Hi%20Sir%2CMadam.%0AWe%E2%80%99ve%20developed%20an%20easy-to-use%20Salon%20Management%20Software%20to%20automate%20appointments%2C%20save%20time%2C%20and%20boost%20monthly%20income.%20Let%20me%20know%20if%20you%E2%80%99d%20like%20a%20quick%20demo." target="_blank">
                WhatsApp
            </a>-->

            <div class="top-bar">
                <p class="total-record">
                    Total Records: <strong id="totlaApponintment">0</strong>
                </p>
                <div id="pagination" class="pagination"></div>

            </div>


        </div>
        <div class="chart-panel">
            <div class="panel-header">
                Graphs
            </div>
            <canvas id="sheetChart" height="100"></canvas>
        </div>




    </div>

    <script>

        const API_URL = "https://script.google.com/macros/s/AKfycbzISBW0lUV5Q18HbX59F7EiUKojjwSP29MzZT3vdOxnLgdl61E0wj2mTYRNQpZdIv1U/exec";
        let allData = [];
        let currentPage = 1;
        const rowsPerPage = 5; // change this as needed
        let totalCount = 0;

        function loadData() {
            const overlay = document.getElementById("overlay");
            const tableContainer = document.getElementById("tableContainer");
            const pagination = document.getElementById("pagination");

            overlay.style.display = "flex";       // show loading
            tableContainer.style.display = "inline-grid-lanes"; // hide table
            pagination.style.display = "none";     // hide pagination


            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    allData = data;           // store all appointments
                    totalCount = data.length;
                    currentPage = 1;          // reset to first page
                    displayTable();           // display first page
                    tableContainer.style.display = "inline-grid-lanes"; // show table
                    pagination.style.display = "flex";    // show pagination
                    document.getElementById("totlaApponintment").innerText = totalCount;
                    chart(data);

                })
                .catch(err => console.error("Load Error:", err))
                .finally(() => overlay.style.display = "none"); // hide loading
        }

        function chart(data) {
            const serviceCount = {};

            data.forEach(row => {
                const service = row.Service;

                if (!serviceCount[service]) {
                    serviceCount[service] = 0;
                }

                serviceCount[service]++;
            });
            const labels = Object.keys(serviceCount);
            const values = Object.values(serviceCount);
            const maxValue = Math.max(...values);
            const ctx = document.getElementById('sheetChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar', // change to 'pie' if you want
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Bookings',
                        data: values,
                        backgroundColor: [
                            '#667eea',
                            '#f6ad55',
                            '#48bb78',
                            '#ed64a6',
                            '#38b2ac',
                            '#9f7aea'
                        ],
                        borderRadius: 6,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            min: 0,
                            max: maxValue,
                            grace: 0,
                            ticks: {
                                stepSize: 1,
                                autoSkip: false,
                                precision: 0
                            }
                        }
                    }
                }
            });
        }
        // Display table for current page
        function displayTable() {
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageData = allData.slice(start, end);

            let bookedTimes = allData.map(item => item.Time); // get all booked times


            let table = "";
            pageData.forEach(item => {
                table += `<tr>
              <td>${item.Name}</td>
              <td>${item.Service}</td>
              <td>${item.Time}</td>
              <td>
                <a href="https://wa.me/918860168841?text=Hi%20your%20appointment%20is%20at%20${encodeURIComponent(item.Time)}" target="_blank" style="text-decoration:none;">
                  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
                       alt="WhatsApp" style="width:24px; height:24px;">
                </a>
              </td>
            </tr>`;
            });

            document.getElementById("tableBody").innerHTML = table;
            //const select = document.getElementById("time");
            //const startTime = 9; // 09:00
            //const endTime = 20;  // 20:00

            //for (let h = startTime; h <= endTime; h++)
            //{
            //    for (let m = 0; m < 60; m += 15) {
            //        if (h === end && m > 0) continue; // stop at 20:00 exactly
            //        let hour = h.toString().padStart(2, '0');
            //        let min = m.toString().padStart(2, '0');
            //        let time = `${hour}:${min}`;

            //        let option = document.createElement('option');
            //        option.value = time;
            //        option.textContent = time;

            //        // Disable if already booked
            //        if (bookedTimes.includes(time)) {
            //            option.disabled = true;
            //            option.textContent += " (Booked)";
            //        }

            //        select.appendChild(option);
            //    }
            //}



            //updatePageInfo();
            renderPagination();
        }

        // Call loadData after DOM is ready
        document.addEventListener("DOMContentLoaded", loadData);

        function renderPagination() {
            const totalPages = Math.ceil(allData.length / rowsPerPage);
            const pagination = document.getElementById("pagination");

            pagination.innerHTML = "";

            if (totalPages <= 1) return;

            const maxVisible = 5; // how many center buttons to show
            let start = Math.max(1, currentPage - 2);
            let end = Math.min(totalPages, currentPage + 2);

            // Always show first page
            if (start > 1) {
                createButton(1);
                if (start > 2) addDots();
            }

            for (let i = start; i <= end; i++) {
                createButton(i);
            }

            // Always show last page
            if (end < totalPages) {
                if (end < totalPages - 1) addDots();
                createButton(totalPages);
            }

            function createButton(page) {
                const btn = document.createElement("button");
                btn.innerText = page;

                if (page === currentPage) {
                    btn.classList.add("active");
                }

                btn.addEventListener("click", function () {
                    currentPage = page;
                    displayTable();
                    renderPagination();
                });

                pagination.appendChild(btn);
            }

            function addDots() {
                const span = document.createElement("span");
                span.innerText = "...";
                span.style.padding = "5px";
                pagination.appendChild(span);
            }
        }


    </script>


</body>
</html>
