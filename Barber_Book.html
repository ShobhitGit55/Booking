<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Booking</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 40px;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 12px;
    max-width: 600px;
    margin: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
}

button {
    width: 100%;
    padding: 10px;
    background: #667eea;
    color: white;
    border: none;
    cursor: pointer;
}

table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
}

th {
    background: #667eea;
    color: white;
}
</style>
</head>

<body>

<div class="container">
<h2>Book Appointment</h2>

<input type="text" id="name" placeholder="Name">
<select id="service">
<option value="">Select Service</option>
<option>Haircut</option>
<option>Massage</option>
<option>Gym</option>
<option>Consultation</option>
</select>
<input type="time" id="time">

<button onclick="submitForm()">Book</button>

<h2>All Appointments</h2>
<table>
<thead>
<tr>
<th>Name</th>
<th>Service</th>
<th>Time</th>
</tr>
</thead>
<tbody id="tableBody">
</tbody>
</table>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbzISBW0lUV5Q18HbX59F7EiUKojjwSP29MzZT3vdOxnLgdl61E0wj2mTYRNQpZdIv1U/exec";


function loadData(){
fetch(API_URL)
.then(res => res.json())
.then(data => {
let table = "";
data.forEach(item => {
table += `<tr>
<td>${item.Name}</td>
<td>${item.Service}</td>
<td>${item.Time}</td>
</tr>`;
});
document.getElementById("tableBody").innerHTML = table;
});
}

function submitForm(){
let name = document.getElementById("name").value;
let service = document.getElementById("service").value;
let time = document.getElementById("time").value;

fetch(API_URL, {
  method: "POST",
  body: JSON.stringify({
    Name: name,
    Service: service,
    Time: time
  })
})
.then(response => response.text())
.then(result => {
  loadData();
})
.catch(error => console.error("Error:", error));
loadData();

</script>

</body>
</html>
