<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Booking</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 12px;
    width: 350px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    background: #667eea;
    color: white;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #5a67d8;
}

.success {
    text-align: center;
    margin-top: 15px;
    color: green;
    display: none;
}
</style>
</head>

<body>

<div class="container">
    <h2>Book Appointment</h2>

    <input type="text" id="name" placeholder="Enter Your Name" required>
    
    <select id="service">
        <option value="">Select Service</option>
        <option>Haircut</option>
        <option>Massage</option>
        <option>Gym Session</option>
        <option>Consultation</option>
    </select>

    <input type="time" id="time" required>

    <button onclick="submitForm()">Book Now</button>

    <div class="success" id="successMsg">
        Appointment Booked Successfully!
    </div>
</div>

<script>

 const API_URL = "https://script.google.com/macros/s/AKfycbzISBW0lUV5Q18HbX59F7EiUKojjwSP29MzZT3vdOxnLgdl61E0wj2mTYRNQpZdIv1U/exec
";

function submitForm() {

    let name = document.getElementById("name").value;
    let service = document.getElementById("service").value;
    let time = document.getElementById("time").value;

    if(name === "" || service === "" || time === "") {
        alert("Please fill all fields");
        return;
    }

    fetch(API_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            Name: name,
            Service: service,
            Time: time
        })
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("successMsg").style.display = "block";
        document.getElementById("name").value = "";
        document.getElementById("service").value = "";
        document.getElementById("time").value = "";
    })
    .catch(error => {
        alert("Error submitting form");
        console.log(error);
    });

}

</script>

</body>
</html>
