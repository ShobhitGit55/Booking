<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Booking</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 40px;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 12px;
    max-width: 600px;
    margin: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
}

button {
    width: 100%;
    padding: 10px;
    background: #667eea;
    color: white;
    border: none;
    cursor: pointer;
}

table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
}

th {
    background: #667eea;
    color: white;
}
</style>
</head>

<body>

<div class="container">
<h2>Book Appointment</h2>

<input type="text" id="name" placeholder="Name">
<select id="service">
<option value="">Select Service</option>
<option>Haircut</option>
<option>Massage</option>
<option>Gym</option>
<option>Consultation</option>
<option>Other</option>

</select>
<label for="time">Select Time:</label>
<select id="time">
  <option value="">--Select Time--</option>
 
</select>

<button onclick="submitForm()">Book</button>

<h2>All Appointments</h2>
<table>
<thead>
<tr>
<th>Name</th>
<th>Service</th>
<th>Time</th>
<th>Chat</th>

</tr>
</thead>
<tbody id="tableBody">
</tbody>
</table>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzISBW0lUV5Q18HbX59F7EiUKojjwSP29MzZT3vdOxnLgdl61E0wj2mTYRNQpZdIv1U/exec";

function loadData() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      let table = "";
      let bookedTimes = data.map(item => item.Time); // get all booked times

      // Populate table
      data.forEach(item => {
        table += `<tr>
          <td>${String(item.Name)}</td>
          <td>${String(item.Service)}</td>
          <td>${String(item.Time)}</td>
          <td>
            <a href="https://wa.me/918860168841?text=Hi%20your%20appointment%20is%20at%20${encodeURIComponent(item.Time)}" target="_blank" style="text-decoration:none;">
              <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" 
                   alt="WhatsApp" 
                   style="width:24px; height:24px;">
            </a>
          </td>
        </tr>`;
      });

      document.getElementById("tableBody").innerHTML = table;

      // Populate time select with 15-minute intervals
      const select = document.getElementById("time");
      const start = 9; // 09:00
      const end = 20;  // 20:00

      for(let h=start; h<=end; h++){
        for(let m=0; m<60; m+=15){
          if(h===end && m>0) continue; // stop at 20:00 exactly
          let hour = h.toString().padStart(2,'0');
          let min = m.toString().padStart(2,'0');
          let time = `${hour}:${min}`;

          let option = document.createElement('option');
          option.value = time;
          option.textContent = time;

          // Disable if already booked
          if(bookedTimes.includes(time)){
            option.disabled = true;
            option.textContent += " (Booked)";
          }

          select.appendChild(option);
        }
      }

    })
    .catch(error => console.error("Load Error:", error));
}

function submitForm() {
  let name = document.getElementById("name").value.trim();
  let service = document.getElementById("service").value.trim();
  let time = document.getElementById("time").value.trim();


  if (!name || !service || !time) {
    alert("Please fill all fields");
    return;
  }

  fetch(API_URL)
    .then(res => res.json())
    .then(data => {

      let alreadyBooked = data.some(item => 
        String(item.Time).trim() === time
      );

      if (alreadyBooked) {
        alert("This time slot is already booked!");
        return;
      }

     return fetch(API_URL, {
  method: "POST",
  body: JSON.stringify({
    Name: name,
    Service: service,
    Time: time
     })
});


    })
    .then(response => {
      if (response) {
        alert("Appointment Booked!");

        // ✅ CLEAR FIELDS HERE
        document.getElementById("name").value = "";
        document.getElementById("service").value = "";
        document.getElementById("time").value = "";

        loadData();
      }
    })
    .catch(error => console.error("Error:", error));
}


// Auto load when page opens
loadData();

</script>


</body>
</html>
